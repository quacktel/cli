[settings]
experimental = true
lockfile = true

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
goreleaser = "2.20.2"
lefthook = "2.2.2"

[tasks."check:tidy"]
run = ["go mod tidy -diff", "go -C examples/otel-go-app mod tidy -diff"]

[tasks."check:lint"]
run = "golangci-lint run --timeout 3m"

[tasks.fix]
run = ["go fix ./...", "golangci-lint fmt", "golangci-lint run --fix"]

[tasks.test]
run = "go test -race -count=1 ./..."

[tasks.install]
# A stable path outside mise's per-Go-version dir, because the LaunchAgent records the binary's absolute path.
env = { GOBIN = "{{env.HOME}}/.local/bin" }
run = "go install ./cmd/quacktel"
