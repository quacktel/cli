name: Homebrew Tap
description: Validates a generated Homebrew formula against the release archive checksum and updates the tap repository
author: https://github.com/wolfeidau
requirements:
  - gh
  - base64
  - buildkite-agent
configuration:
  properties:
    tap:
      description: Homebrew tap repository in owner/name format
      type: string
    formula-path:
      description: Path to the formula file in the tap repository
      type: string
    artifact-path:
      description: Buildkite artifact path for the generated formula
      type: string
    archive:
      description: Archive filename referenced by the formula
      type: string
    checksum-artifact:
      description: Buildkite artifact path for the archive SHA-256 file
      type: string
    github-token-secret:
      description: Buildkite cluster secret name holding the GitHub token for the tap repository
      type: string
    macos-only:
      description: Assert that the formula declares depends_on :macos
      type: boolean
    skip-prerelease:
      description: Validate the formula but skip pushing to the tap for prerelease tags
      type: boolean
  required:
    - tap
    - formula-path
    - artifact-path
    - archive
    - checksum-artifact
    - github-token-secret
  additionalProperties: false
