steps:
  - group: ":mag: QA"
    key: quality_checks
    steps:
      - label: ":golangci-lint: lint"
        retry:
          automatic:
            # mise-cache exits 75 when GitHub downloads fail.
            - exit_status: 75
              limit: 2
        commands:
          - mise run check:tidy
          - mise run check:lint
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_lint

      - label: ":go: test"
        retry:
          automatic:
            - exit_status: 75
              limit: 2
        command: go test -race -count=1 ./...
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_test

  - group: ":package: build"
    key: build
    steps:
      - label: ":goreleaser: build {{matrix}}"
        agents:
          queue: "{{matrix}}"
        matrix:
          - macos-medium
          - linux-small
          - linux-arm64-small
        retry:
          automatic:
            - exit_status: 75
              limit: 2
        command: goreleaser release --snapshot --clean
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_build
