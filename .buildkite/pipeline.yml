steps:
  - group: ":mag: QA"
    key: quality_checks
    steps:
      - label: ":golangci-lint: lint"
        agents:
          queue: macos-medium
        retry:
          automatic:
            # mise-cache exits 75 when GitHub downloads fail.
            - exit_status: 75
              limit: 2
        commands:
          - mise run check:tidy
          - mise run check:lint
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_lint

      - label: ":go: test"
        agents:
          queue: macos-medium
        retry:
          automatic:
            - exit_status: 75
              limit: 2
        command: go test -race -count=1 ./...
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_test

  - group: ":package: build"
    key: build
    steps:
      - label: ":goreleaser: build {{matrix}}"
        agents:
          queue: "{{matrix}}"
        matrix:
          - macos-medium
          - linux-small
          - linux-arm64-small
        retry:
          automatic:
            - exit_status: 75
              limit: 2
        command: goreleaser release --snapshot --clean
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_build

  # Push a tag, then start a main build with RELEASE_TAG=<tag>. Releases are immutable, so a failed publish needs a new tag.
  - group: ":rocket: release"
    key: release
    if: build.env("RELEASE_TAG") != null
    depends_on: [quality_checks, build]
    steps:
      # DuckDB needs CGO, so each target builds natively and uploads its archive as a Buildkite artifact.
      - label: ":goreleaser: release build {{matrix}}"
        key: release_build
        agents:
          queue: "{{matrix}}"
        matrix:
          - macos-medium
          - linux-small
          - linux-arm64-small
        retry: &release_retry
          automatic:
            - exit_status: 75
              limit: 2
        command: .buildkite/release-build.sh
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_build
      # One job creates the GitHub release with every asset, so it is complete before it becomes immutable.
      - label: ":github: publish release"
        depends_on: release_build
        agents:
          queue: linux-small
        retry: *release_retry
        command: .buildkite/release-publish.sh
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
