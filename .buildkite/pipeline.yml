steps:
  - group: ":mag: QA"
    key: quality_checks
    steps:
      - label: ":golangci-lint: lint"
        agents:
          queue: macos-medium
        retry:
          automatic:
            # mise-cache exits 75 when GitHub downloads fail.
            - exit_status: 75
              limit: 2
        commands:
          - mise run check:tidy
          - mise run check:lint
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_lint

      - label: ":go: test"
        agents:
          queue: macos-medium
        retry:
          automatic:
            - exit_status: 75
              limit: 2
        command: go test -race -count=1 ./...
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_test

  - group: ":package: build"
    key: build
    steps:
      - label: ":goreleaser: build {{matrix}}"
        agents:
          queue: "{{matrix}}"
        matrix:
          - macos-medium
          - linux-small
          - linux-arm64-small
        retry:
          automatic:
            - exit_status: 75
              limit: 2
        command: goreleaser release --snapshot --clean
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_build

  # Iterating: push a tag, then start a main build with RELEASE_TAG=<tag>. Re-runs replace the release's assets.
  - group: ":rocket: release"
    key: release
    if: build.env("RELEASE_TAG") != null
    depends_on: [quality_checks, build]
    steps:
      - label: ":goreleaser: release macos-medium"
        key: release_darwin
        agents:
          queue: macos-medium
        retry: &release_retry
          automatic:
            - exit_status: 75
              limit: 2
        command: .buildkite/release.sh
        plugins: &release_plugins
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_build
      # Waits for macOS so only one job creates the GitHub release; the rest append to it.
      - label: ":goreleaser: release {{matrix}}"
        depends_on: release_darwin
        agents:
          queue: "{{matrix}}"
        matrix:
          - linux-small
          - linux-arm64-small
        retry: *release_retry
        command: .buildkite/release.sh
        plugins: *release_plugins
