# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: quacktel

# DuckDB needs CGO, so each runner builds only its own target and appends it to the shared release.
builds:
  - id: darwin_arm64
    skip: '{{ not (and (eq .Runtime.Goos "darwin") (eq .Runtime.Goarch "arm64")) }}'
    goos: [darwin]
    goarch: [arm64]
    main: &main ./cmd/quacktel
    binary: &binary quacktel
    env: &env
      - CGO_ENABLED=1
    flags: &flags
      - -trimpath
    ldflags: &ldflags
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
  - id: linux_amd64
    skip: '{{ not (and (eq .Runtime.Goos "linux") (eq .Runtime.Goarch "amd64")) }}'
    goos: [linux]
    goarch: [amd64]
    main: *main
    binary: *binary
    env: *env
    flags: *flags
    ldflags: *ldflags
  - id: linux_arm64
    skip: '{{ not (and (eq .Runtime.Goos "linux") (eq .Runtime.Goarch "arm64")) }}'
    goos: [linux]
    goarch: [arm64]
    main: *main
    binary: *binary
    env: *env
    flags: *flags
    ldflags: *ldflags

archives:
  - formats: [tar.gz]
    # No version in the name, so install.sh can use releases/latest/download.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# One .sha256 per archive, because each runner publishes separately and a shared checksums.txt would be overwritten.
checksum:
  split: true

changelog:
  disable: true

# A formula, not a cask: casks get com.apple.quarantine, which un-notarised binaries can't pass.
brews:
  - name: quacktel
    repository:
      owner: quacktel
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/quacktel/cli
    description: Local OpenTelemetry sink for coding agents, stored as Parquet, queried via MCP
    license: Apache-2.0
    # Only the macOS job publishes, so the formula lists just the darwin archive.
    skip_upload: '{{ ne .Runtime.Goos "darwin" }}'
    service: |
      run [opt_bin/"quacktel", "serve", "--auth"]
      keep_alive true
      log_path var/"log/quacktel.log"
      error_log_path var/"log/quacktel.log"
    caveats: |
      Run quacktel at login with either `brew services start quacktel` or
      `quacktel service install`, not both: only one serve can hold the data dir.
    test: |
      assert_match version.to_s, shell_output("#{bin}/quacktel version")

release:
  mode: append
  replace_existing_artifacts: true
  prerelease: auto
